name: Geekom A9 Max - Ollama Local
version: 1.0.0
schema: v1
models:
  - name: Qwen 2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat
      - edit
      - apply
      - agent

  - name: Qwen 2.5 Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 400
      maxPromptTokens: 1024
      multilineCompletions: auto

  - name: Nomic Embed Text
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed
