name: Local Config
version: 1.0.0
schema: v1

models:
  - name: LM Studio Qwen 7B (Autocomplete)
    provider: openai
    model: lmstudio-community/qwen2.5-coder-7b-instruct
    apiBase: http://localhost:1234/v1
    apiKey: lmstudio
    roles:
      - autocomplete
      - edit
      - chat

autocomplete:
  numTokens: 180
  debounceDelayMs: 0
  maxPromptTokens: 8000
  triggerMode: automatic
  triggerCharacters: ["\n", "(", "[", "{", ",", " "]

context:
  includeCode: true
  includeComments: true
  includeImports: true
  maxFileTokens: 8000

indexing:
  enabled: false